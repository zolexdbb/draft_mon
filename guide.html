<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Mon a déménagé</title>
<link rel="canonical" href="https://draft-mon.github.io/draft_mon/guide.html">
<script>
  // Draft Mon a déménagé sur https://draft-mon.github.io/draft_mon/. Les sauvegardes du jeu sont liées à l'adresse du site : on les
  // transmet à la nouvelle adresse dans le fragment #migration=... (jamais envoyé au serveur), et le jeu
  // les importe à l'arrivée s'il n'a encore aucune donnée.
  (function(){
    var data = {}, n = 0;
    try {
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k.indexOf('draftArena')===0){ data[k] = localStorage.getItem(k); n++; }
      }
    } catch(e){}
    var target = 'https://draft-mon.github.io/draft_mon/guide.html';
    if(n && target === 'https://draft-mon.github.io/draft_mon/') target += '#migration=' + encodeURIComponent(JSON.stringify(data));
    location.replace(target);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://draft-mon.github.io/draft_mon/guide.html"></noscript>
</head>
<body style="font-family:sans-serif;background:#120F0C;color:#eee;text-align:center;padding:60px 20px;">
<p>Draft Mon a déménagé : <a href="https://draft-mon.github.io/draft_mon/guide.html" style="color:#F6D888;">https://draft-mon.github.io/draft_mon/guide.html</a></p>
</body>
</html>
